name: Diagnose Windows maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-11-arm
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s scripts/tests -p test_windows_maintenance.py -v
