name: Build distributions

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux audio headers
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Select pinned Rust
        run: |
          rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test packaging validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.package }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: k3-linux-x86_64
            archive: k3-linux-x86_64.tar.gz
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: k3
            rustflags: ""
            platform: linux
            cli_only: false
          - package: k3-windows-x86_64
            archive: k3-windows-x86_64.zip
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: k3.exe
            rustflags: -C target-feature=+crt-static
            platform: windows
            cli_only: false
          - package: k3-macos-x86_64-cli
            archive: k3-macos-x86_64-cli.tar.gz
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable: k3
            rustflags: ""
            platform: macos
            cli_only: true
          - package: k3-macos-aarch64
            archive: k3-macos-aarch64.tar.gz
            os: macos-15
            target: aarch64-apple-darwin
            executable: k3
            rustflags: ""
            platform: macos
            cli_only: false
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_NAME: ${{ matrix.package }}
      ARCHIVE_NAME: ${{ matrix.archive }}
      BUILD_TARGET: ${{ matrix.target }}
      EXECUTABLE_NAME: ${{ matrix.executable }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config

      - name: Select pinned Rust target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "$BUILD_TARGET"

      - name: Build release binary
        run: cargo build --release --locked --bins --target ${{ matrix.target }}

      - name: Install build Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        if: ${{ !matrix.cli_only }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"

      - name: Build offline CPU runtime and models
        if: ${{ !matrix.cli_only }}
        run: python scripts/build-runtime.py --output dist/runtime

      - name: Package distribution
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          CLI_ONLY: ${{ matrix.cli_only }}
        run: |
          set -euo pipefail
          package_args=("$PACKAGE_PLATFORM" "$PACKAGE_NAME" "target/$BUILD_TARGET/release/$EXECUTABLE_NAME")
          if [[ "$CLI_ONLY" == "true" ]]; then
            package_args+=(--cli-only)
          else
            package_args+=(dist/runtime)
          fi
          python scripts/package-dist.py "${package_args[@]}"

      - name: Check extracted distribution
        shell: bash
        env:
          CLI_ONLY: ${{ matrix.cli_only }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          check_args=("dist/$ARCHIVE_NAME")
          if [[ "$CLI_ONLY" == "true" ]]; then
            check_args+=(--cli-only)
          fi
          python scripts/check-dist.py "${check_args[@]}"

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/${{ matrix.archive }}*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
