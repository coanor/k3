name: Build distributions

on:
  workflow_dispatch:
    inputs:
      installer_source_run:
        description: "复用成功运行的便携包构建安装包（留空则从头构建）"
        required: false
        default: ""
        type: string
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  PYTHONUTF8: "1"

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.installer_source_run == ''
    name: Verify workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux audio headers
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          libasound2-dev libfontconfig1-dev libxkbcommon-x11-0
          pkg-config libgl1-mesa-dri weston xvfb

      - name: Select repository Rust toolchain
        run: rustup show active-toolchain

      - name: Test packaging validation
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build GUI smoke binary
        run: cargo build --package k3-gui --locked

      - name: Smoke-test GUI on X11
        run: |
          set +e
          timeout 5s xvfb-run -a env \
            K3_GUI_SETTINGS_PATH="$RUNNER_TEMP/k3-x11-settings.json" \
            K3_GUI_LOG_PATH="$RUNNER_TEMP/k3-x11.log" \
            ./target/debug/k3-gui
          status=$?
          set -e
          test "$status" -eq 124

      - name: Smoke-test GUI on Wayland
        run: |
          runtime_dir="$RUNNER_TEMP/k3-wayland-runtime"
          mkdir -p "$runtime_dir"
          chmod 700 "$runtime_dir"
          XDG_RUNTIME_DIR="$runtime_dir" weston \
            --backend=headless-backend.so \
            --socket=k3-ci-wayland \
            --idle-time=0 \
            --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            [[ -S "$runtime_dir/k3-ci-wayland" ]] && break
            sleep 0.1
          done
          [[ -S "$runtime_dir/k3-ci-wayland" ]]
          set +e
          XDG_RUNTIME_DIR="$runtime_dir" \
            WAYLAND_DISPLAY=k3-ci-wayland \
            XDG_SESSION_TYPE=wayland \
            K3_GUI_SETTINGS_PATH="$RUNNER_TEMP/k3-wayland-settings.json" \
            K3_GUI_LOG_PATH="$RUNNER_TEMP/k3-wayland.log" \
            timeout 5s ./target/debug/k3-gui
          status=$?
          set -e
          test "$status" -eq 124

  windows-check:
    name: Check Windows workspace
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select repository Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Check Windows targets
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo check --workspace --all-targets --locked

      - name: Parse Windows separation scripts
        shell: pwsh
        run: |
          foreach ($script in @('separate.ps1', 'install-separator.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$null, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Verify UTF-8 manifests in Windows PowerShell
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/test-windows-separator-utf8.ps1 -WorkRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build:
    if: (github.event_name == 'workflow_dispatch' && inputs.installer_source_run == '') || startsWith(github.ref, 'refs/tags/')
    name: Build ${{ matrix.package }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: k3-linux-x86_64
            archive: k3-linux-x86_64.tar.gz
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: k3
            rustflags: ""
            platform: linux
            cli_only: false
          - package: k3-windows-x86_64
            archive: k3-windows-x86_64.zip
            os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: k3.exe
            rustflags: -C target-feature=+crt-static
            platform: windows
            cli_only: false
          - package: k3-macos-x86_64-cli
            archive: k3-macos-x86_64-cli.tar.gz
            os: macos-15-intel
            target: x86_64-apple-darwin
            executable: k3
            rustflags: ""
            platform: macos
            cli_only: true
          - package: k3-macos-aarch64
            archive: k3-macos-aarch64.tar.gz
            os: macos-15
            target: aarch64-apple-darwin
            executable: k3
            rustflags: ""
            platform: macos
            cli_only: false
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_NAME: ${{ matrix.package }}
      ARCHIVE_NAME: ${{ matrix.archive }}
      BUILD_TARGET: ${{ matrix.target }}
      EXECUTABLE_NAME: ${{ matrix.executable }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev libfontconfig1-dev pkg-config

      - name: Select pinned Rust target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "$BUILD_TARGET"

      - name: Build release binary
        shell: bash
        run: |
          cargo build --release --locked --bins --target "$BUILD_TARGET" --package k3
          if [[ "${{ runner.os }}" == "Linux" || "${{ runner.os }}" == "Windows" ]]; then
            cargo build --release --locked --target "$BUILD_TARGET" --package k3-gui
          fi

      - name: Install build Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        if: ${{ !matrix.cli_only }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"

      - name: Build offline CPU runtime and models
        if: ${{ !matrix.cli_only }}
        run: python scripts/build-runtime.py --output dist/runtime

      - name: Package distribution
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          CLI_ONLY: ${{ matrix.cli_only }}
        run: |
          set -euo pipefail
          package_args=("$PACKAGE_PLATFORM" "$PACKAGE_NAME" "target/$BUILD_TARGET/release/$EXECUTABLE_NAME")
          if [[ "$CLI_ONLY" == "true" ]]; then
            package_args+=(--cli-only)
          else
            package_args+=(dist/runtime)
          fi
          if [[ "$PACKAGE_PLATFORM" == "linux" ]]; then
            package_args+=(--gui-binary "target/$BUILD_TARGET/release/k3-gui")
          elif [[ "$PACKAGE_PLATFORM" == "windows" ]]; then
            package_args+=(--gui-binary "target/$BUILD_TARGET/release/k3-gui.exe")
          fi
          python scripts/package-dist.py "${package_args[@]}"

      - name: Check extracted distribution
        shell: bash
        env:
          CLI_ONLY: ${{ matrix.cli_only }}
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          set -euo pipefail
          check_args=("dist/$ARCHIVE_NAME")
          if [[ "$CLI_ONLY" == "true" ]]; then
            check_args+=(--cli-only)
          fi
          python scripts/check-dist.py "${check_args[@]}"

      - name: Verify Linux GUI package contents
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/verify-linux-gui-package.sh "dist/$ARCHIVE_NAME"

      - name: Verify UTF-8 manifests in Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/test-windows-separator-utf8.ps1 -WorkRoot $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/${{ matrix.archive }}*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  installers:
    name: Install ${{ matrix.package }}
    needs: build
    if: >-
      always() && !cancelled() &&
      (needs.build.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.installer_source_run != ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: k3-linux-x86_64
            archive: k3-linux-x86_64.tar.gz
            os: ubuntu-24.04
            cli_only: false
          - package: k3-windows-x86_64
            archive: k3-windows-x86_64.zip
            os: windows-latest
            cli_only: false
          - package: k3-macos-aarch64
            archive: k3-macos-aarch64.tar.gz
            os: macos-15
            cli_only: false
          - package: k3-macos-x86_64-cli
            archive: k3-macos-x86_64-cli.tar.gz
            os: macos-15-intel
            cli_only: true
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Check out installer source
        uses: actions/checkout@v7

      - name: Validate reused distribution run
        if: inputs.installer_source_run != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.installer_source_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo '运行 ID 必须是数字' >&2; exit 1; }
          gh run view "$SOURCE_RUN" --json conclusion,workflowName,headSha > "$RUNNER_TEMP/source-run.json"
          python -c 'import json,os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"source-run.json").read_text()); assert r["conclusion"] == "success" and r["workflowName"] == "Build distributions", r; print(r)'

      - name: Download validated portable distribution
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.package }}
          path: dist/source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installer_source_run || github.run_id }}

      - name: Install build Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test installer validation
        run: python -m unittest discover -s scripts/tests -v

      - name: Install uv for refreshed worker
        if: inputs.installer_source_run != '' && !matrix.cli_only
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.13"

      - name: Locate Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.7.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $compiler)) { throw '找不到 Inno Setup 编译器' }
          "K3_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Build native installer
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
          SOURCE_RUN: ${{ inputs.installer_source_run }}
        run: |
          set -euo pipefail
          args=("dist/source/$ARCHIVE_NAME")
          if [[ "$RUNNER_OS" == Windows ]]; then args+=(--iscc "$K3_ISCC"); fi
          if [[ -n "$SOURCE_RUN" ]]; then args+=(--refresh-worker); fi
          python scripts/build-installer.py "${args[@]}"

      - name: Install Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ./dist/installers/*.deb
          k3 --help
          sudo touch /opt/k3/user-preserved.txt

      - name: Install macOS package
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg dist/installers/*.pkg -target /
          /usr/local/bin/k3 --help
          pkgutil --pkg-info io.github.coanor.k3

      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installers/*-setup.exe).FullName
          $root = Join-Path $env:RUNNER_TEMP 'K3 安装测试'
          $log = Join-Path $env:RUNNER_TEMP 'k3-install.log'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SP-', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$root`"", "/LOG=`"$log`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $log; throw "安装失败：$($process.ExitCode)" }
          "K3_INSTALLED_ROOT=$root" >> $env:GITHUB_ENV
          Set-Content (Join-Path $root 'user-preserved.txt') '用户数据'

      - name: Check installed programs and offline separation
        shell: bash
        env:
          CLI_ONLY: ${{ matrix.cli_only }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) root=/opt/k3; commands=/usr/bin ;;
            macOS) root=/usr/local/lib/k3; commands=/usr/local/bin ;;
            Windows) root="$K3_INSTALLED_ROOT"; commands="$root" ;;
          esac
          args=(--installed-root "$root" --command-dir "$commands")
          if [[ "$CLI_ONLY" == true ]]; then args+=(--cli-only); fi
          python scripts/check-dist.py "${args[@]}"
          if [[ "$CLI_ONLY" != true ]]; then
            if [[ "$RUNNER_OS" == Windows ]]; then
              worker_python="$root/runtime/python/python.exe"
            else
              worker_python="$root/runtime/python/bin/python3"
            fi
            "$worker_python" -I -m unittest discover -s python/separator/tests -p test_runtime.py -v
          fi

      - name: Check Linux uninstall preserves user files
        if: runner.os == 'Linux'
        run: |
          sudo apt-get remove --yes k3
          test ! -e /usr/bin/k3
          test ! -e /opt/k3/k3
          test -f /opt/k3/user-preserved.txt

      - name: Check Windows uninstall preserves user files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Join-Path $env:K3_INSTALLED_ROOT 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "卸载失败：$($process.ExitCode)" }
          if (Test-Path (Join-Path $env:K3_INSTALLED_ROOT 'k3.exe')) { throw '卸载未删除程序' }
          if (-not (Test-Path (Join-Path $env:K3_INSTALLED_ROOT 'user-preserved.txt'))) { throw '卸载删除了用户文件' }

      - name: Upload checked installer
        uses: actions/upload-artifact@v7
        with:
          name: dist-installers-${{ matrix.package }}
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
  public-release:
    name: Publish binaries to public repository
    if: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PUBLIC_RELEASE_REPO != '' }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 | sort -k2 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Publish public release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PUBLIC_RELEASE_REPO: ${{ vars.PUBLIC_RELEASE_REPO }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '缺少 PUBLIC_RELEASE_TOKEN secret' >&2; exit 1; }
          [[ "$PUBLIC_RELEASE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo 'PUBLIC_RELEASE_REPO 必须是 owner/repo' >&2
            exit 1
          }
          visibility="$(gh repo view "$PUBLIC_RELEASE_REPO" --json visibility --jq '.visibility')"
          [[ "$visibility" == PUBLIC ]] || { echo '目标仓库必须公开' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --repo "$PUBLIC_RELEASE_REPO" >/dev/null 2>&1; then
            echo '公开发行版已存在，请使用新版本号' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/k3-public-release-notes.md" <<EOF
          K3 $RELEASE_TAG 的预编译发行包。请下载对应平台的压缩包，并使用 SHA256SUMS 核对文件。

          此仓库仅用于公开发行；K3 源代码仓库仍为私有。
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$PUBLIC_RELEASE_REPO" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/k3-public-release-notes.md"
