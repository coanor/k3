name: Diagnose Windows maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            machine: aarch64
          - os: windows-latest
            machine: x86_64
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepare minimal native CLI and real installer assets
        shell: pwsh
        run: |
          Set-Content -LiteralPath "$env:RUNNER_TEMP/k3-probe.rs" -Value 'fn main() { println!("k3 0.1.3"); }'
          rustc -C target-feature=+crt-static "$env:RUNNER_TEMP/k3-probe.rs" -o "$env:RUNNER_TEMP/k3.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/package-online.py support
          python scripts/package-online.py programs windows aarch64 "$env:RUNNER_TEMP/k3.exe"
      - name: Run actual bootstrap and inspect retained Python
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File install.ps1 -InstallDir "$env:RUNNER_TEMP/K3 online 安装" -SourceDir "$PWD/dist/online" -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $root = Join-Path $env:RUNNER_TEMP 'K3 online 安装'
          Write-Output "[DEBUG-k3-maintenance] root=$root"
          Get-ChildItem -LiteralPath $root -Force | Select-Object Name,LinkType,Target
          if (Test-Path -LiteralPath "$root/runtime/python") {
            Get-ChildItem -LiteralPath "$root/runtime/python" -Force | Select-Object Name,LinkType,Target,Length
          }
          $metadata = Get-Content -LiteralPath "$root/installation-state.json" -Raw | ConvertFrom-Json
          $metadata.files.PSObject.Properties.Name | Where-Object { $_ -match '^runtime/python/[^/]+$' }
          & powershell.exe -NoProfile -NonInteractive -Command "`$root = '$root'; `$file=Join-Path `$root 'runtime/python/python.exe'; Write-Output ('[DEBUG-k3-maintenance] Python exists: ' + (Test-Path -LiteralPath `$file)); Get-Item -LiteralPath `$file -Force | Format-List FullName,LinkType,Target,Length"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$root/uninstall.ps1" -Yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
